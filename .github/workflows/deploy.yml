name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pruebas de sistema
        # Si el sistema de diseño no se cumple, no se publica. Estas dos no
        # necesitan el tema, así que corren antes de clonar nada y fallan rápido.
        run: |
          node pruebas-emojis.mjs
          php pruebas-vencimiento.php

      - name: Clonar el tema al lado
        # El banco vive en el tema y necesita a los dos. Acá no hay condición:
        # cualquier cambio del plugin puede llegar al área de miembros, que es
        # casi todo lo que el plugin renderiza.
        run: git clone --depth 1 https://github.com/maggioremarketing/vitrinexo-theme.git ../vitrinexo-theme

      - name: Prueba de colores
        # Va después del clonado a propósito. La prueba compara su copia de la
        # paleta contra el :root del tema solo cuando el tema está al lado;
        # corriendo antes leía la copia y la daba por buena, así que la copia
        # podía quedarse atrás sin que nadie se enterara, y se quedó atrás seis
        # colores. Acá sí compara: si el tema repinta, este deploy frena hasta
        # que la copia se ponga al día.
        #
        # Antes de npm ci, que se demora, para que un color fuera de la paleta
        # falle en segundos.
        run: node pruebas-colores.mjs

      - name: Dependencias del tema
        working-directory: ../vitrinexo-theme
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas del área de miembros
        run: bash ../vitrinexo-theme/banco/ci.sh

      - name: Configurar SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan es best-effort: si falla (red/transitorio) NO debe tumbar el deploy.
          # El rsync usa StrictHostKeyChecking=no de todas formas. Reintenta hasta 3 veces.
          for i in 1 2 3; do
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 3
          done
          true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy (intento 1)
        id: deploy1
        continue-on-error: true
        run: |
          rsync -az --checksum --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}

      - name: Esperar y reintentar si falló
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Intento 1 falló. Esperando 90 segundos..."
          sleep 90
          rsync -az --checksum --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}

      - name: Purgar caché
        run: |
          WP_PATH="${SSH_TARGET%/wp-content/*}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$WP_PATH' && \
             wp cache flush --allow-root 2>/dev/null && echo 'Object cache OK' || true && \
             wp litespeed-purge all --allow-root 2>/dev/null && echo 'LiteSpeed OK' || true"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
